<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="./css/style.css">
    <title>GitHub Random Repository</title>
</head>

<body>
    <div class="container">
        <h1 class="my-4 text-center">GitGub Random Repository</h1>
        <div class="row">
            <div class="col">
                <form id="selector">
                    <div class="input-group input-group-lg">
                        <input autofocus type="text" list="selector-datalist" id="selector-input"
                            class="form-control" />
                        <button type="submit" class="btn btn-primary" id="selector-submit">Carregar</button>
                    </div>
                    <datalist id="selector-datalist"></datalist>
                </form>
            </div>
        </div>
        <div id="message-container">
            <div class="row">
                <div class="col">
                    <div id="message" class="mt-2"></div>
                </div>
            </div>
        </div>
        <div id="repo-container" hidden>
            <div class="row">
                <div class="col">
                    <div class="card">
                        <div class="card-header repo-owner">
                            <span id="repo-owner-avatar"></span>
                            <span id="repo-owner-name"></span>
                        </div>
                        <div class="card-body">
                            <h4 id="repo-title"></h4>
                            <div id="repo-desc"></div>
                        </div>
                        <div class="card-footer">
                            <div class="row">
                                <div class="col-lg-2 col-md-3 col-3">
                                    <span id="repo-lang" title="Linguagem"></span>
                                </div>
                                <div class="col-lg-2 col-md-3 col-3">
                                    <span id="repo-stars" title="Estrelas"></span>
                                </div>
                                <div class="col-lg-2 col-md-3 col-3">
                                    <span id="repo-forks" title="Forks"></span>
                                </div>
                                <div class="col-lg-2 col-md-3 col-3">
                                    <span id="repo-issues" title="Issues abertas"></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <script type="module" src="./js/app.js"></script>
</body>

</html>

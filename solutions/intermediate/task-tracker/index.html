<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Task Tracker</title>
</head>

<body>
    <div class="container">
        <h1>Task Tracker</h1>
        <form id="form">
            <div class="form-container">
                <input type="text" name="taskContent" id="input" placeholder="Nova tarefa..." autofocus />
                <button type="submit" style="transform: rotate(180deg);">&#x27A6;</button>
            </div>
        </form>
        <ul id="list"></ul>
        <div id="message-empty">Lista de tarefas vazia.</div>
    </div>
    <script type="module" src="./js/script.js"></script>
</body>

</html>
